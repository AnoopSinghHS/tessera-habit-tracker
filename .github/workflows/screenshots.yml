name: UI screenshots

# Manual: boots an emulator, seeds sample habits, walks through the app and saves a
# screenshot of each screen to the `ci-screenshots` branch (and as a run artifact).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run the screenshot tour on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p shots
            ./gradlew connectedDebugAndroidTest --stacktrace || touch shots/TEST_FAILED
            adb pull /sdcard/Download/tessera-shots/. shots/ || true

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            shots
            app/build/reports/androidTests
          if-no-files-found: warn

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          ls -la shots || true
          mkdir -p "$RUNNER_TEMP/out"
          cp shots/*.png "$RUNNER_TEMP/out/" 2>/dev/null || true
          if ls "$RUNNER_TEMP"/out/*.png >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --orphan ci-screenshots
            git rm -rf --quiet .
            cp "$RUNNER_TEMP"/out/*.png .
            git add ./*.png
            git commit -q -m "UI screenshots from run ${{ github.run_id }}"
            git push -f origin ci-screenshots
          fi

      - name: Fail if the tour failed
        run: test ! -e shots/TEST_FAILED

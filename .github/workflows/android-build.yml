name: Android build

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Stage APKs
        id: stage
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/tessera-s26-ultra-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/tessera-s26-ultra-debug.apk
          ls -lh dist/
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tessera-release-apk
          path: dist/tessera-s26-ultra-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tessera-debug-apk
          path: dist/tessera-s26-ultra-debug.apk
          if-no-files-found: error

      # Releases are published only from the default branch, tagged with the app's
      # versionName so the in-app updater can tell whether a release is newer.
      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.stage.outputs.version }}
          name: "Tessera v${{ steps.stage.outputs.version }}"
          body: |
            Tessera v${{ steps.stage.outputs.version }}

            - `tessera-s26-ultra-release.apk`: install this one.
            - `tessera-s26-ultra-debug.apk`: debug build.

            If Android refuses to install over your existing copy, save a backup in
            Settings, uninstall, install this version, then load the backup.
          files: |
            dist/tessera-s26-ultra-release.apk
            dist/tessera-s26-ultra-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
